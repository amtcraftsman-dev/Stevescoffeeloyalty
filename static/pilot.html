<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b3f23">
<title>Steve's Coffee | Pilot</title>
<link rel="manifest" href="/app.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><span class="logo">☕ Steve's Coffee</span></header>
<main>
  <form method="post" class="card" style="max-width:420px;margin:36px auto">
    <h1>Steve's Coffee pilot</h1>
    <p>Enter the access code provided by the shop. Use sample names and phone numbers for test orders.</p>
    <!-- error -->
    <label for="code">Pilot access code</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required>
    <button class="btn block" style="margin-top:14px">Open pilot</button>
  </form>
</main>
</body>
</html>
