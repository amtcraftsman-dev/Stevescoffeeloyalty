<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steve's Coffee: Staff</title>
<link rel="stylesheet" href="/style.css">
<style>
main{max-width:1100px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(260px, 100%),1fr));align-items:start}
.col h2{margin:0 0 8px;display:flex;justify-content:space-between}
.ticket{background:#fff;border:1px solid var(--line);border-left:6px solid var(--accent);padding:16px;margin-bottom:10px}
.ticket.ready{border-left-color:var(--ok)}.ticket.here{border-left-color:var(--bad);background:#fff4f2}
.ticket .t{font:1.2rem Georgia,serif}
.ticket ul{margin:8px 0;padding-left:18px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--line);padding:2px 7px;border-radius:99px;margin-right:4px}
.staff-login{max-width:440px;margin:40px auto}
.staff-login .code-row{display:flex;align-items:stretch;gap:8px}
.staff-login .code-row input{min-width:0}
.staff-login .btn.block{margin-top:12px}
[hidden]{display:none!important}
.tag.red{background:#fbe9e7;color:var(--bad)}.tag.gold{background:#fff4d6;color:#6a4b00}
</style>
</head>
<body>
<header><div class="header-inner staff-header">
  <span class="logo"><img src="/steves-logo.png" width="60" height="48" alt="">Steve’s Coffee <span class="staff-label">Staff</span></span>
  <span id="ctl"></span>
</div></header>
<main>
  <form id="staff-login" class="card staff-login">
    <h1>Staff sign-in</h1>
    <p class="muted">Enter the staff code set for this app in Render.</p>
    <label for="p">Staff code</label>
    <div class="code-row">
      <input id="p" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <button class="btn ghost sm" id="show" type="button" aria-controls="p">Show</button>
    </div>
    <button class="btn block" id="go" type="submit">Open order screen</button>
    <p class="err" id="login-error" role="alert" hidden></p>
  </form>
  <div id="app" hidden></div>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const money = c => '$' + (c / 100).toFixed(2);
let pin = '', seen = null, timer;
const form = $('#staff-login');
const input = $('#p');
const submit = $('#go');
const loginError = $('#login-error');
const storageKey = 'steves-staff-code';

function rememberCode(code) {
  try {
    if (code) sessionStorage.setItem(storageKey, code);
    else sessionStorage.removeItem(storageKey);
  } catch {
    // The order screen can still work for this page when browser storage is blocked.
  }
}

async function api(path, body) {
  const o = { headers: { 'X-Staff-Code': encodeURIComponent(pin) }, cache: 'no-store' };
  if (body !== undefined) {
    o.method = 'POST';
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(body);
  }
  const r = await fetch('/api' + path, o);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Error'); e.status = r.status; throw e; }
  return d;
}

function showSignIn(message = '') {
  clearTimeout(timer);
  pin = '';
  seen = null;
  rememberCode('');
  $('#ctl').replaceChildren();
  $('#app').hidden = true;
  $('#app').replaceChildren();
  form.hidden = false;
  loginError.textContent = message;
  loginError.hidden = !message;
}

$('#show').onclick = () => {
  const reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  $('#show').textContent = reveal ? 'Hide' : 'Show';
  input.focus();
};

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (submit.disabled) return;
  pin = input.value.trim();
  if (!pin) {
    showSignIn('Enter your staff code.');
    return;
  }
  submit.disabled = true;
  loginError.hidden = true;
  try {
    if (await load()) {
      input.value = '';
      input.type = 'password';
      $('#show').textContent = 'Show';
    }
  } finally {
    submit.disabled = false;
  }
});

function beep() {
  try { const c = new AudioContext(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + .25); } catch { }
}

async function load() {
  clearTimeout(timer);
  const currentCode = pin;
  let d;
  try { d = await api('/staff/orders'); }
  catch (e) {
    if (pin !== currentCode) return false;
    const message = e.status === 401
      ? 'That code does not match STAFF_PIN in Render.'
      : e.status === 403
        ? 'Pilot access expired. Reload this page and enter the pilot code first.'
        : 'Could not reach the order screen. Try again in a moment.';
    showSignIn(message);
    return false;
  }
  if (!pin || pin !== currentCode) return false;
  rememberCode(pin);
  form.hidden = true;
  $('#app').hidden = false;
  const ids = new Set(d.orders.map(o => o.id));
  if (seen && [...ids].some(i => !seen.has(i))) beep();
  seen = ids;
  const by = s => d.orders.filter(o => o.status === s);
  const ticket = o => `<div class="ticket ${o.status === 'ready' ? 'ready' : ''} ${o.arrived ? 'here' : ''}">
    <div class="row"><span class="t">${esc(o.name)}</span><span class="t">${esc(o.pickup_label)}</span></div>
    <div class="small muted">#${esc(o.id.slice(-6))}${o.phone_last4 ? ' · ···' + esc(o.phone_last4) : ' · guest'}</div>
    <div style="margin-top:4px">${o.pickup_type === 'curbside' ? `<span class="tag red">CURBSIDE: ${esc(o.vehicle)}</span>` : ''}${o.arrived ? '<span class="tag red">📍 HERE NOW</span>' : ''}${o.reward_id ? `<span class="tag gold">REWARD: ${esc(o.reward_id)}</span>` : ''}${o.clover_id === 'SYNC_FAILED' ? '<span class="tag red">NOT IN CLOVER</span>' : ''}</div>
    <ul>${o.lines.map(l => `<li><b>${l.qty}× ${esc(l.name)}</b>${l.desc.length ? `<div class="small muted">${esc(l.desc.join(', '))}</div>` : ''}</li>`).join('')}</ul>
    <div class="row"><div class="acts">${({
      received: `<button class="btn sm" data-s="preparing" data-id="${o.id}">Start</button>`,
      preparing: `<button class="btn sm" data-s="ready" data-id="${o.id}">Ready</button>`,
      ready: `<button class="btn sm" data-s="picked_up" data-id="${o.id}">Picked up</button>`
    })[o.status] || ''}${['received', 'preparing', 'ready'].includes(o.status) ? `<button class="btn ghost sm" data-s="cancelled" data-id="${o.id}">Cancel</button>` : ''}</div>
    <span class="small muted">${money(o.total_cents)}</span></div></div>`;
  const col = (t, s) => `<div class="col"><h2>${t} <span class="badge" style="background:var(--line)">${by(s).length}</span></h2>${by(s).map(ticket).join('') || '<div class="muted small">Nothing here</div>'}</div>`;
  $('#ctl').innerHTML = `<button class="btn sm" id="pause" style="background:${d.paused ? 'var(--bad)' : 'var(--ok)'}">${d.paused ? '⏸ Online orders PAUSED, tap to resume' : '● Online orders ON, tap to pause'}</button> <button class="btn sm" id="out">Sign out</button>`;
  $('#out').onclick = () => { input.value = ''; showSignIn(); input.focus(); };
  $('#pause').onclick = async () => { await api('/staff/pause', { paused: !d.paused }); load(); };
  $('#app').innerHTML = `<div class="cols">${col('New', 'received')}${col('Making', 'preparing')}${col('Ready', 'ready')}</div>
    <h2 style="margin-top:24px">Recently finished</h2>
    <div class="small muted">${d.orders.filter(o => ['picked_up', 'cancelled'].includes(o.status)).map(o => `#${esc(o.id.slice(-6))} ${esc(o.name)} (${o.status.replace('_', ' ')})`).join(' · ') || 'None'}</div>`;
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
    if (b.dataset.s === 'cancelled' && !confirm('Cancel this order?')) return;
    try { await api(`/staff/orders/${b.dataset.id}/status`, { status: b.dataset.s }); } catch (e) { alert(e.message); }
    load();
  });
  timer = setTimeout(load, 5000);
  return true;
}

try {
  sessionStorage.removeItem('pin');
  pin = sessionStorage.getItem(storageKey) || '';
} catch {
  // Leave the sign-in form available when browser storage is blocked.
}
if (pin) load();
</script>
</body>
</html>
